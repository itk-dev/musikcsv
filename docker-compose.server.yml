# itk-version: 2.0.1
networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  node:
    # Production only runs `yarn install` and `yarn start`, so it needs no
    # toolchain: slim is 332 MB against 1546 MB, same Node, and still ships
    # yarn 1.22.22. Local development and CI use the same image.
    image: node:24-slim
    restart: unless-stopped
    command: yarn start
    # 1042 is the deploy user in ITK's images, so the tree on the server is
    # owned by it. It has no passwd entry in the node image, so HOME must be
    # set or tools that cache under it fail with EACCES.
    user: ${NODE_UID_GID:-1042:1042}
    environment:
      - HOME=/tmp
      - NODE_ENV=production
    working_dir: /app
    networks:
      - app
      - frontend
    volumes:
      - .:/app:delegated
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.rule=Host(`${COMPOSE_SERVER_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_SERVER_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      # The node image has no EXPOSE, so traefik cannot guess the port.
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"
