networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  mssql:
    # Opt-in: docker compose --profile db up -d
    # Default image is arm64-native so it runs unemulated on Apple Silicon.
    # CI overrides MSSQL_IMAGE with real SQL Server, which is amd64-only and
    # segfaults under QEMU (verified), but runs natively on GitHub runners.
    # Pinned by digest: Azure SQL Edge is retired upstream.
    profiles:
      - db
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/azure-sql-edge:latest@sha256:902628a8be89e35dfb7895ca31d602974c7bafde4d583a0d0873844feb1c42cf}
    networks:
      - app
    ports:
      - "127.0.0.1::1433"
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Passw0rd!Local}
    volumes:
      - mssql-data:/var/opt/mssql

  node:
    # Same image as production, so the tests exercise what is deployed.
    image: node:24-slim
    command: yarn start-dev
    working_dir: /app
    networks:
      - app
      - frontend
    ports:
      - "127.0.0.1::3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app:delegated
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_DOMAIN}`)"
      # The node image has no EXPOSE, so traefik cannot guess the port.
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"
      # - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=redirect-to-https"
      # - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  markdownlint:
    # Opt-in: docker compose --profile dev run --rm markdownlint markdownlint '**/*.md'
    image: itkdev/markdownlint
    profiles:
      - dev
    volumes:
      - ./:/md

  prettier:
    # Opt-in: docker compose --profile dev run --rm prettier '**/*.{yml,yaml}' --check
    # Prettier does not (yet, fcf.
    # https://github.com/prettier/prettier/issues/15206) have an official
    # docker image.
    # https://hub.docker.com/r/jauderho/prettier is good candidate (cf. https://hub.docker.com/search?q=prettier&sort=updated_at&order=desc)
    image: jauderho/prettier
    profiles:
      - dev
    volumes:
      - ./:/work

volumes:
  mssql-data:
